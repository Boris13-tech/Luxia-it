# nginx sample configuration for Luxia-IT
# Copy the relevant directives into your server block.

server {
    listen 443 ssl http2;
    server_name luxia-it.example;

    root /var/www/luxia-it;
    index Home.dc.html;

    # ---- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content-Security-Policy. Matches the sources the site actually loads.
    # (three.js from esm.sh, React from unpkg for the DC runtime, Google Fonts).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://esm.sh https://unpkg.com; connect-src 'self' https://esm.sh https://unpkg.com; object-src 'none'; upgrade-insecure-requests" always;

    # ---- Compression & caching -------------------------------------------
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/html;

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML files re-validate on every request so content updates propagate.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Root document is Home.dc.html
    location = / {
        return 301 /Home.dc.html;
    }
}
