# Serveur du site statique (image nginx non privilégiée, port 8080).
# Le TLS est terminé en amont (répartiteur de charge ou reverse proxy).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 16k;

    # Seules les méthodes de lecture sont acceptées par un site statique.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # Ressources versionnées par Astro : cache long et immuable.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Fichiers cachés interdits, sauf /.well-known/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
