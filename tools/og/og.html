<!doctype html>
<!-- Gabarit de l'image de partage (1200 × 630). Rendu par tools/og/render.mjs. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Roboto Variable';
        src: url('../../node_modules/@fontsource-variable/roboto/files/roboto-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f6f6f3;
        font-family: 'Roboto Variable', sans-serif;
        color: #111418;
      }
      .card {
        box-sizing: border-box;
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-left: 12px solid #1f5fbf;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .logo svg {
        width: 72px;
        height: 64px;
      }
      .name {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1;
      }
      .tag {
        margin-top: 8px;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #1f5fbf;
      }
      h1 {
        margin: 0;
        max-width: 960px;
        font-size: 64px;
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.025em;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        padding-top: 22px;
        border-top: 1px solid #d6d6cf;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 20px;
        letter-spacing: 0.04em;
        color: #5a6069;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="6.5 1 39 35" aria-hidden="true">
          <polygon points="23.6,8.4 32.2,8.4 44,34.6 34.6,34.6" fill="#8db3e8" stroke="#8db3e8" stroke-linejoin="round"></polygon>
          <polygon points="22,2 32.2,2 18.2,34.6 8,34.6" fill="#1f5fbf" stroke="#1f5fbf" stroke-linejoin="round"></polygon>
        </svg>
        <div>
          <div class="name">LUXIA-IT</div>
          <div class="tag">Identité &amp; confiance</div>
        </div>
      </div>
      <h1>Plateformes d’identité et de confiance pour les opérations critiques.</h1>
      <div class="foot">
        <span>luxia-it.com</span>
        <span>IDENTITÉS · ACCÈS · TRACES D’AUDIT</span>
      </div>
    </div>
  </body>
</html>
